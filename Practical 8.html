<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-lg p-8 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Student Registration
        </h1>

        <form id="registrationForm">

            <!-- Name -->
            <label class="block font-semibold mb-2">Student Name</label>
            <input type="text" id="name"
                class="w-full border rounded-lg p-3 mb-1"
                placeholder="Enter your name">
            <p id="nameError" class="text-red-500 text-sm mb-4"></p>

            <!-- Email -->
            <label class="block font-semibold mb-2">Email</label>
            <input type="text" id="email"
                class="w-full border rounded-lg p-3 mb-1"
                placeholder="Enter your email">
            <p id="emailError" class="text-red-500 text-sm mb-4"></p>

            <!-- Password -->
            <label class="block font-semibold mb-2">Password</label>
            <input type="password" id="password"
                class="w-full border rounded-lg p-3 mb-1"
                placeholder="Minimum 8 characters">
            <p id="passwordError" class="text-red-500 text-sm mb-4"></p>

            <!-- Mobile -->
            <label class="block font-semibold mb-2">Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border rounded-lg p-3 mb-1"
                placeholder="Enter 10-digit mobile number">
            <p id="mobileError" class="text-red-500 text-sm mb-4"></p>

            <button type="submit"
                class="w-full bg-blue-600 text-white p-3 rounded-lg
                       font-semibold hover:bg-blue-700">
                Register
            </button>

            <p id="success" class="text-green-600 text-center mt-4 font-semibold"></p>

        </form>
    </div>

    <script>

        document.getElementById("registrationForm").addEventListener("submit",
            function(event) {

                event.preventDefault();

                // Get values
                let name = document.getElementById("name").value.trim();
                let email = document.getElementById("email").value.trim();
                let password = document.getElementById("password").value;
                let mobile = document.getElementById("mobile").value.trim();

                // Clear previous messages
                document.getElementById("nameError").textContent = "";
                document.getElementById("emailError").textContent = "";
                document.getElementById("passwordError").textContent = "";
                document.getElementById("mobileError").textContent = "";
                document.getElementById("success").textContent = "";

                let valid = true;

                // Name validation
                if (name === "") {
                    document.getElementById("nameError").textContent =
                        "Name is required.";
                    valid = false;
                }

                // Email validation
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email === "") {
                    document.getElementById("emailError").textContent =
                        "Email is required.";
                    valid = false;
                }
                else if (!emailPattern.test(email)) {
                    document.getElementById("emailError").textContent =
                        "Enter a valid email address.";
                    valid = false;
                }

                // Password validation
                if (password.length < 8) {
                    document.getElementById("passwordError").textContent =
                        "Password must contain at least 8 characters.";
                    valid = false;
                }

                // Mobile validation
                let mobilePattern = /^[0-9]{10}$/;

                if (!mobilePattern.test(mobile)) {
                    document.getElementById("mobileError").textContent =
                        "Enter a valid 10-digit mobile number.";
                    valid = false;
                }

                // Success
                if (valid) {
                    document.getElementById("success").textContent =
                        "Registration successful!";
                }

            });

    </script>

</body>
</html>
