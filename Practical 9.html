<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center p-6">

    <div class="bg-white w-full max-w-xl p-6 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Personal To-Do List
        </h1>

        <!-- Add Task -->
        <div class="flex gap-2 mb-6">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-3
                       focus:outline-none focus:ring-2 focus:ring-blue-500">

            <button
                onclick="addTask()"
                class="bg-blue-600 text-white px-5 py-3 rounded-lg
                       hover:bg-blue-700">
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let taskText = input.value.trim();

            // Check empty task
            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-100 p-3 rounded-lg";

            // Task text
            let span = document.createElement("span");
            span.textContent = taskText;
            span.className = "text-gray-800 cursor-pointer";

            // Mark task completed
            span.addEventListener("click", function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            });

            // Delete button
            let deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className =
                "bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600";

            deleteButton.addEventListener("click", function () {
                li.remove();
            });

            // Add elements to list item
            li.appendChild(span);
            li.appendChild(deleteButton);

            // Add task to list
            document.getElementById("taskList").appendChild(li);

            // Clear input
            input.value = "";
        }

    </script>

</body>
</html>
