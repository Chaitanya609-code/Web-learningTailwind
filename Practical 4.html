<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-indigo-600 text-white text-center py-8">
        <h1 class="text-4xl font-bold">New Product Collection</h1>
        <p class="mt-2 text-lg">Discover our latest products</p>
    </header>

    <!-- Product Showcase -->
    <section class="max-w-6xl mx-auto px-6 py-10">

        <div class="flex flex-col md:flex-row gap-8 items-center">

            <!-- Product 1 -->
            <div class="bg-white rounded-xl shadow-lg p-6 w-full md:w-1/3
                        hover:shadow-2xl transition">

                <img src="https://via.placeholder.com/300"
                     alt="Smart Watch"
                     class="w-full h-56 object-cover rounded-lg">

                <h2 class="text-2xl font-bold mt-5">Smart Watch</h2>
                <p class="text-gray-600 mt-2">
                    Stylish smartwatch with modern features.
                </p>

                <p class="text-xl font-bold text-indigo-600 mt-4">₹2,999</p>

                <button class="mt-4 w-full bg-indigo-600 text-white
                               py-3 rounded-lg hover:bg-indigo-700">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-xl shadow-lg p-6 w-full md:w-1/3
                        hover:shadow-2xl transition">

                <img src="https://via.placeholder.com/300"
                     alt="Wireless Headphones"
                     class="w-full h-56 object-cover rounded-lg">

                <h2 class="text-2xl font-bold mt-5">Wireless Headphones</h2>
                <p class="text-gray-600 mt-2">
                    Enjoy high-quality sound without wires.
                </p>

                <p class="text-xl font-bold text-indigo-600 mt-4">₹1,999</p>

                <button class="mt-4 w-full bg-indigo-600 text-white
                               py-3 rounded-lg hover:bg-indigo-700">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white rounded-xl shadow-lg p-6 w-full md:w-1/3
                        hover:shadow-2xl transition">

                <img src="https://via.placeholder.com/300"
                     alt="Laptop"
                     class="w-full h-56 object-cover rounded-lg">

                <h2 class="text-2xl font-bold mt-5">Laptop</h2>
                <p class="text-gray-600 mt-2">
                    Powerful laptop for work and entertainment.
                </p>

                <p class="text-xl font-bold text-indigo-600 mt-4">₹49,999</p>

                <button class="mt-4 w-full bg-indigo-600 text-white
                               py-3 rounded-lg hover:bg-indigo-700">
                    Buy Now
                </button>
            </div>

        </div>
    </section>

</body>
</html>
