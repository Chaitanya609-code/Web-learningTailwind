<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <section class="max-w-6xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
      Our Food Menu
    </h1>

    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- Card 1 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
             class="w-full h-48 object-cover">

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800">Pizza</h2>
          <p class="text-gray-600 mt-2">
            Delicious cheesy pizza topped with fresh vegetables.
          </p>

          <button class="mt-4 bg-red-600 text-white px-5 py-2 rounded-lg
                         hover:bg-red-700">
            Order Now
          </button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
             class="w-full h-48 object-cover">

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800">Burger</h2>
          <p class="text-gray-600 mt-2">
            Juicy burger with fresh vegetables and crispy fries.
          </p>

          <button class="mt-4 bg-red-600 text-white px-5 py-2 rounded-lg
                         hover:bg-red-700">
            Order Now
          </button>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141"
             class="w-full h-48 object-cover">

        <div class="p-5">
          <h2 class="text-2xl font-bold text-gray-800">Pasta</h2>
          <p class="text-gray-600 mt-2">
            Creamy Italian pasta prepared with fresh ingredients.
          </p>

          <button class="mt-4 bg-red-600 text-white px-5 py-2 rounded-lg
                         hover:bg-red-700">
            Order Now
          </button>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
